[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ceramics-ai-service"
version = "0.1.0"
description = "AI service for the ceramics manufacturing pipeline: natural-language order extraction"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.40",
    "pydantic>=2.12",
    "pydantic-settings>=2.15",
    "python-dotenv>=1.2",
    "pydantic-ai-slim[openai]>=2.33",
    "httpx>=0.28",
    "tenacity>=9.1",
    "structlog>=26.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "ruff>=0.15",
    "mypy>=1.19",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not live' --strict-markers"
markers = [
    "live: hits the real LLM provider; requires RUN_AI_INTEGRATION_TESTS=1",
    "regression: golden-dataset field accuracy suite",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
packages = ["app"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
